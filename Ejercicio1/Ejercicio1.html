<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="utf-8">
    <title> Ejercicio 1_CSS Zacaria El Kaid</title>
    <link rel="stylesheet" href="CSS/Ejercicio1.css">
    
</head>
<body>

    <img id="fondo" src="Imagenes/diomande.jpg" alt="Diomande con el Balón de Oro">

    <header id="cabecera">

        <h1>BALON DE ORO</h1>
        <p class="subtitulo">Boto para el BALON DE ORO</p>

    </header>

    <section>

        <article>

            <form id="formulario">

            <label for="formulario">Elige Tu Balon De Oro:</label>
                <select id="form" name="formulario">
                <option value="Diomande">Diomande</option>
                <option value="Mastantuono">Mastantuono</option>
                <option value="Enner Valencia">Enner Valencia</option>
                <option value="Tchouameni">Tchouameni</option>
                <option value="CuencaMan">CuencaMan</option>
                <option value="CaizaBurger">CaizaBurger</option>
                <option value="Omar">Omar</option>
                <option value="Guamingo">Guamingo</option>
                </select>
                <br><br>

                <span class="campo">¿Merece ganarlo?</span><br>
                <input type="radio" id="si" name="merece" value="si">
                <label for="si">Si</label>
                <input type="radio" id="no" name="merece" value="no">
                <label for="no">No</label>
                <br><br>

                <label class="comentario" for="comentario">Comentarios:</label>
                <textarea id="comentario" name="comentario" rows="4" cols="30"></textarea>
                <br><br>

                <input type="submit" value="enviar">


            </form>

        </article>
    </section>

</body>

</html>
